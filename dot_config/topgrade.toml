# topgrade config (installed by the dotfiles Nix profile)
# Path: ~/.config/topgrade.toml (preferred over topgrade/topgrade.toml)
# https://github.com/topgrade-rs/topgrade
#
# Daily updates: topgrade

[misc]
assume_yes = false
# Skip noisy / privileged steps; use OS tools for those manually.
# self_update: topgrade comes from Nix and updates with nixpkgs, not from
# GitHub releases (self-update also hits api.github.com rate limits / 403).
# nix: the built-in step runs nix-channel/nix-env on the imperative default
# profile, which we don't use; see [commands] for the flake-based profiles.
disable = [
  "system",
  "firmware",
  "containers",
  "vim",
  "emacs",
  "self_update",
  "nix",
]

# topgrade auto-detects: mise, uv, chezmoi, github_cli_extensions, bun, pnpm,
# yarn, rustup/cargo, etc.

[mise]
# bump = false

[commands]
# Bump nixpkgs in nix/flake.nix; chezmoi apply rebuilds the profile because the
# lock hash changed. Commit nix/flake.lock afterwards. Other sources (e.g.
# chezmoi-private) add their own commands via ~/.config/topgrade.d/*.toml.
"Nix profile (dotfiles)" = "nix flake update --flake $HOME/.local/share/chezmoi/nix && chezmoi apply"
"Nix (self-upgrade)" = "sudo determinate-nixd upgrade"
